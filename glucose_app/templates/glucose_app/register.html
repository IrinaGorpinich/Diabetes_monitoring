{% extends "/Users/gorpinicirina/Documents/diabetes_monitoring/glucose_app/templates/glucose_app/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card p-4">
            <h3 class="text-center">Register</h3>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <input name="username" class="form-control mb-2" placeholder="Username">
                <input name="password" type="password" class="form-control mb-2" placeholder="Password">
                <button class="btn btn-success w-100">Create</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login/">Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
